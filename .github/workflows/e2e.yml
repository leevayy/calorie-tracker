name: End-to-end tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_ai:
        description: Run the opt-in live-AI smoke project
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: calorie_tracker_e2e
          POSTGRES_USER: calorie_e2e
          POSTGRES_PASSWORD: calorie_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorie_e2e -d calorie_tracker_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://calorie_e2e:calorie_e2e_password@127.0.0.1:5432/calorie_tracker_e2e
      JWT_SECRET: e2e-only-jwt-secret-at-least-16-characters
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:3000
      VITE_API_BASE_URL: http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      E2E_TEST_MODE: "1"
      E2E_CONTROL_SECRET: e2e-control-secret-at-least-16-characters
      E2E_TEST_EMAIL: playwright@example.invalid
      E2E_TEST_PASSWORD: playwright-local-only-password
      E2E_ARTIFACT_DIR: artifacts/playwright/redacted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright browsers
        run: npm run e2e:install
      - name: Prepare clean E2E database and test user
        run: npm run e2e:prepare
      - name: Run deterministic Playwright suite
        run: npm run e2e:test
      - name: Verify deterministic artifact safety
        id: verify_artifacts
        if: always()
        run: npm run e2e:verify-artifacts
      - name: Upload redacted deterministic artifacts
        if: ${{ always() && steps.verify_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-deterministic-${{ github.run_attempt }}
          path: |
            artifacts/playwright/redacted/test-results
            artifacts/playwright/redacted/html-report
            artifacts/playwright/redacted/service-logs
            artifacts/playwright/redacted/results.json
          if-no-files-found: warn
          retention-days: 7

  live-ai:
    name: Opt-in live-AI smoke
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_ai)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: calorie_tracker_e2e_live
          POSTGRES_USER: calorie_e2e
          POSTGRES_PASSWORD: calorie_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorie_e2e -d calorie_tracker_e2e_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://calorie_e2e:calorie_e2e_password@127.0.0.1:5432/calorie_tracker_e2e_live
      JWT_SECRET: e2e-only-jwt-secret-at-least-16-characters
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_URL: http://127.0.0.1:3000
      VITE_API_BASE_URL: http://127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      E2E_TEST_MODE: "1"
      E2E_LIVE_AI: "1"
      E2E_CONTROL_SECRET: e2e-control-secret-at-least-16-characters
      E2E_TEST_EMAIL: playwright-live@example.invalid
      E2E_TEST_PASSWORD: playwright-local-only-password
      E2E_ARTIFACT_DIR: artifacts/playwright/redacted
      YANDEX_AI_STUDIO_API_KEY: ${{ secrets.E2E_YANDEX_AI_STUDIO_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.E2E_YANDEX_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Require scheduled or opt-in live-AI secrets
        run: |
          test -n "$YANDEX_AI_STUDIO_API_KEY"
          test -n "$YANDEX_FOLDER_ID"
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright browsers
        run: npm run e2e:install
      - name: Prepare clean live-AI database and test user
        run: npm run e2e:prepare
      - name: Run tagged live-AI smoke project
        run: npm run e2e:live
      - name: Verify live-AI artifact safety
        id: verify_artifacts
        if: always()
        run: npm run e2e:verify-artifacts
      - name: Upload redacted live-AI artifacts
        if: ${{ always() && steps.verify_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-ai-${{ github.run_attempt }}
          path: |
            artifacts/playwright/redacted/test-results
            artifacts/playwright/redacted/html-report
            artifacts/playwright/redacted/service-logs
            artifacts/playwright/redacted/results.json
          if-no-files-found: warn
          retention-days: 7
