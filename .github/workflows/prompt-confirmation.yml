name: Prompt confirmation

on:
  workflow_dispatch:
  push:
    branches: [codex/prompt-investigation-20260816]
    paths:
      - .github/workflows/prompt-confirmation.yml
      - analytics/scripts/run-live-prompt-confirmation.mjs

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROMPT_CONFIRMATION_CONCURRENCY: "6"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Resolve the deployed production model without exposing credentials
        id: production_model
        uses: appleboy/ssh-action@v1.2.5
        env:
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VM_DEPLOY_PATH
          capture_stdout: true
          script: |
            set -euo pipefail
            cd "${VM_DEPLOY_PATH:-/opt/calorie-tracker}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api node -e '
              const preference = process.env.AI_MODEL_PREFERENCE || "qwen3";
              const names = {alicegpt:"YANDEX_AI_STUDIO_MODEL_ALICE_GPT",aliceflash:"YANDEX_AI_STUDIO_MODEL_ALICE_FLASH",qwen36:"YANDEX_AI_STUDIO_MODEL_QWEN36",qwen3:"YANDEX_AI_STUDIO_MODEL_QWEN3",gptoss120:"YANDEX_AI_STUDIO_MODEL_GPT_OSS_120B",gptoss:"YANDEX_AI_STUDIO_MODEL_GPT_OSS"};
              const defaults = {alicegpt:"aliceai-llm",aliceflash:"aliceai-llm-flash",qwen36:"qwen3.6-35b-a3b",qwen3:"qwen3-235b-a22b-fp8",gptoss120:"gpt-oss-120b",gptoss:"gpt-oss-20b"};
              const envName = names[preference] || "YANDEX_AI_STUDIO_MODEL";
              const modelId = process.env[envName]?.trim() || defaults[preference] || "deepseek-v4-flash";
              console.log(`MODEL_JSON=${JSON.stringify({preference,modelId})}`);
            '

      - name: Export the resolved production model
        env:
          MODEL_STDOUT: ${{ steps.production_model.outputs.stdout }}
        run: |
          set -euo pipefail
          MODEL_JSON="$(node -e 'const m=process.env.MODEL_STDOUT.match(/MODEL_JSON=(\{[^\n]+\})/); if(!m) process.exit(1); process.stdout.write(m[1])')"
          PRODUCTION_MODEL_PREFERENCE="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).preference)' "$MODEL_JSON")"
          PRODUCTION_MODEL_ID="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).modelId)' "$MODEL_JSON")"
          echo "Resolved production model preference: $PRODUCTION_MODEL_PREFERENCE"
          echo "Resolved production model ID: $PRODUCTION_MODEL_ID"
          echo "PRODUCTION_MODEL_PREFERENCE=$PRODUCTION_MODEL_PREFERENCE" >> "$GITHUB_ENV"
          echo "PRODUCTION_MODEL_ID=$PRODUCTION_MODEL_ID" >> "$GITHUB_ENV"

      - name: Run paid confirmation inside the live production API container
        uses: appleboy/ssh-action@v1.2.5
        env:
          VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
          GH_PUSH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          REMOTE_RUN_ID: ${{ github.run_id }}
          PROMPT_CONFIRMATION_CONCURRENCY: ${{ env.PROMPT_CONFIRMATION_CONCURRENCY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VM_DEPLOY_PATH,GH_PUSH_TOKEN,GH_REPOSITORY,REMOTE_RUN_ID,PRODUCTION_MODEL_PREFERENCE,PRODUCTION_MODEL_ID,PROMPT_CONFIRMATION_CONCURRENCY
          command_timeout: 170m
          script: |
            set -euo pipefail
            case "$REMOTE_RUN_ID" in (*[!0-9]*|'') exit 1;; esac
            LAB_DIR="/tmp/calorie-prompt-confirmation-${REMOTE_RUN_ID}"
            test "$LAB_DIR" = "/tmp/calorie-prompt-confirmation-${REMOTE_RUN_ID}"
            trap 'cd /tmp && rm -rf "$LAB_DIR"' EXIT
            rm -rf "$LAB_DIR"
            git clone --depth 1 --branch codex/prompt-investigation-20260816 \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
              "$LAB_DIR"
            cd "$LAB_DIR"

            test -f analytics/runs/2026-08-16-prompt-investigation/manifest.json
            test -f analytics/runs/2026-08-16-prompt-investigation/summary.json
            test -f analytics/runs/2026-08-16-prompt-investigation/dataset.json
            mkdir -p \
              tmp/prompt-investigation/usda/foundation \
              tmp/prompt-investigation/usda/sr-legacy
            curl --fail --location --silent --show-error \
              https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip \
              -o tmp/prompt-investigation/usda/foundation.zip
            curl --fail --location --silent --show-error \
              https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_json_2018-04.zip \
              -o tmp/prompt-investigation/usda/sr-legacy.zip
            unzip -q -o tmp/prompt-investigation/usda/foundation.zip \
              -d tmp/prompt-investigation/usda/foundation
            unzip -q -o tmp/prompt-investigation/usda/sr-legacy.zip \
              -d tmp/prompt-investigation/usda/sr-legacy

            cd "${VM_DEPLOY_PATH:-/opt/calorie-tracker}"
            API_CONTAINER="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q api)"
            test -n "$API_CONTAINER"
            EXPERIMENT_GIT_COMMIT="$(git -C "$LAB_DIR" rev-parse HEAD)"
            docker exec "$API_CONTAINER" mkdir -p \
              /app/analytics/runs/2026-08-16-prompt-investigation \
              /app/tmp/prompt-investigation/usda/foundation \
              /app/tmp/prompt-investigation/usda/sr-legacy
            docker cp \
              "$LAB_DIR/analytics/scripts/run-live-prompt-confirmation.mjs" \
              "$API_CONTAINER:/app/backend/scripts/run-live-prompt-confirmation.mjs"
            docker cp \
              "$LAB_DIR/analytics/runs/2026-08-16-prompt-investigation/manifest.json" \
              "$API_CONTAINER:/app/analytics/runs/2026-08-16-prompt-investigation/manifest.json"
            docker cp \
              "$LAB_DIR/analytics/runs/2026-08-16-prompt-investigation/summary.json" \
              "$API_CONTAINER:/app/analytics/runs/2026-08-16-prompt-investigation/summary.json"
            docker cp \
              "$LAB_DIR/analytics/runs/2026-08-16-prompt-investigation/dataset.json" \
              "$API_CONTAINER:/app/analytics/runs/2026-08-16-prompt-investigation/dataset.json"
            docker cp \
              "$LAB_DIR/tmp/prompt-investigation/usda/foundation/FoodData_Central_foundation_food_json_2026-04-30.json" \
              "$API_CONTAINER:/app/tmp/prompt-investigation/usda/foundation/FoodData_Central_foundation_food_json_2026-04-30.json"
            docker cp \
              "$LAB_DIR/tmp/prompt-investigation/usda/sr-legacy/FoodData_Central_sr_legacy_food_json_2018-04.json" \
              "$API_CONTAINER:/app/tmp/prompt-investigation/usda/sr-legacy/FoodData_Central_sr_legacy_food_json_2018-04.json"

            docker exec \
              -e "PRODUCTION_MODEL_PREFERENCE=$PRODUCTION_MODEL_PREFERENCE" \
              -e "PRODUCTION_MODEL_ID=$PRODUCTION_MODEL_ID" \
              -e "EXPERIMENT_GIT_COMMIT=$EXPERIMENT_GIT_COMMIT" \
              -e "PROMPT_CONFIRMATION_CONCURRENCY=$PROMPT_CONFIRMATION_CONCURRENCY" \
              "$API_CONTAINER" \
              node --experimental-strip-types \
              /app/backend/scripts/run-live-prompt-confirmation.mjs

            docker cp \
              "$API_CONTAINER:/app/analytics/runs/2026-08-16-prompt-confirmation" \
              "$LAB_DIR/analytics/runs/"
            cd "$LAB_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add analytics/runs/2026-08-16-prompt-confirmation
            git commit -m "chore: record live prompt confirmation results"
            git push origin HEAD:codex/prompt-investigation-20260816
